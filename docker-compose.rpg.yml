# Add after existing Compose overlays. No credentials are baked into images.
services:
  client:
    build:
      args:
        VITE_RPG_AUTHORING_PORT: "${VITE_RPG_AUTHORING_PORT:-}"
    environment:
      RPG_TARGET: http://rpg:18420
  rpg:
    build:
      context: ./experiments/ai-rpg-engine
      dockerfile: studio/Dockerfile
    container_name: modelmirror-rpg
    environment:
      RPG_ENABLED: "true"
      RPG_XINGJIAN_ENABLED: "${RPG_XINGJIAN_ENABLED:-false}"
      RPG_XINGJIAN_CALL_LIMIT: "${RPG_XINGJIAN_CALL_LIMIT:-0}"
      RPG_JINYONG_CHAT_ENABLED: "${RPG_JINYONG_CHAT_ENABLED:-false}"
      RPG_JINYONG_CHAT_CALL_LIMIT: "${RPG_JINYONG_CHAT_CALL_LIMIT:-0}"
      RPG_ANCIENT_CHAT_ENABLED: "${RPG_ANCIENT_CHAT_ENABLED:-false}"
      RPG_ANCIENT_CHAT_CALL_LIMIT: "${RPG_ANCIENT_CHAT_CALL_LIMIT:-0}"
      RPG_DOULUO_CHAT_ENABLED: "${RPG_DOULUO_CHAT_ENABLED:-false}"
      RPG_DOULUO_CHAT_CALL_LIMIT: "${RPG_DOULUO_CHAT_CALL_LIMIT:-0}"
      RPG_DRAGON_CHAT_ENABLED: "${RPG_DRAGON_CHAT_ENABLED:-false}"
      RPG_DRAGON_CHAT_CALL_LIMIT: "${RPG_DRAGON_CHAT_CALL_LIMIT:-0}"
      RPG_MYSTERIES_CHAT_ENABLED: "${RPG_MYSTERIES_CHAT_ENABLED:-false}"
      RPG_MYSTERIES_CHAT_CALL_LIMIT: "${RPG_MYSTERIES_CHAT_CALL_LIMIT:-0}"
      RPG_CULTIVATION_CHAT_ENABLED: "${RPG_CULTIVATION_CHAT_ENABLED:-false}"
      RPG_CULTIVATION_CHAT_CALL_LIMIT: "${RPG_CULTIVATION_CHAT_CALL_LIMIT:-0}"
      RPG_SUMMARY_V2_DIR: /data/auto-summary-v2
      RPG_SUMMARY_V2_CALL_LIMIT: "${RPG_SUMMARY_V2_CALL_LIMIT:-0}"
      RPG_CONTROL_URL: "${RPG_CONTROL_URL:-http://server:8000/}"
      RPG_S2S_TOKEN: "${RPG_S2S_TOKEN:-}"
      RPG_CALL_LIMIT_PER_CARD: "${RPG_CALL_LIMIT_PER_CARD:-1}"
      RPG_PUBLIC_ORIGINS: "${RPG_PUBLIC_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      RPG_CREDENTIAL_FILE: /run/secrets/rpg_provider_env
    secrets:
      - rpg_provider_env
    volumes:
      - rpg_sessions:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all(['status','plugins'].map(p=>fetch('http://127.0.0.1:18420/rpg-app/api/'+p))).then(rs=>process.exit(rs.every(r=>r.ok)?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  rpg_sessions:
secrets:
  rpg_provider_env:
    file: ${RPG_ENV_FILE:-./server/.env}
