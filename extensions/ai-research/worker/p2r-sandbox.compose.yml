services:
  default:
    image: python@sha256:401f6e1a67dad31a1bd78e9ad22d0ee0a3b52154e6bd30e90be696bb6a3d7461
    command: ["sleep", "infinity"]
    network_mode: none
    user: "65532:65532"
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    working_dir: /tmp
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
