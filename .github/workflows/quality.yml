name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check frontend
        run: npm run typecheck
      - name: Run frontend tests
        run: npm run test:run
      - name: Build frontend
        run: npm run build

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run workflow contract tests
        run: python -m pytest server/tests/test_workflow_run_contract.py -q
        env:
          CODING_PROJECT_UPLOAD_ROOT: ${{ runner.temp }}/modelmirror-project-uploads
      - name: Run remaining backend test suite
        run: python -m pytest server/tests/ -q --ignore=server/tests/test_workflow_run_contract.py
        env:
          CODING_PROJECT_UPLOAD_ROOT: ${{ runner.temp }}/modelmirror-project-uploads
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  coding-project-host-windows:
    name: Windows Project Host
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run Windows Project Host tests
        run: >-
          python -m pytest
          server/tests/test_coding_project_host_windows.py
          server/tests/test_coding_project_host.py::test_host_commit_windows_native_apply_commit_and_undo
          server/tests/test_coding_project_host.py::test_host_commit_windows_private_object_cleanup_rejects_replacement
          -q -ra -p no:cacheprovider
        env:
          CODING_PROJECT_UPLOAD_ROOT: ${{ runner.temp }}/modelmirror-project-uploads
          PYTHONDONTWRITEBYTECODE: "1"
