name: AI Research V0.1

on:
  pull_request:
    paths:
      - "extensions/ai-research/**"
      - ".dockerignore"
      - ".github/workflows/ai-research.yml"
      - "server/main.py"
      - "server/model_router/ai_research_bridge.py"
      - "server/model_router/chat_control.py"
      - "server/model_router/chat_stable.py"
      - "server/model_router/cleanup_chat_receipts.py"
      - "server/model_router/repository.py"
      - "server/tests/test_ai_research_bridge.py"
      - "server/tests/test_provider_chat_stable_service.py"
  # This event uses the BASE workflow. Its job never checks out or executes HEAD.
  pull_request_target:
    branches: [main]
    paths:
      - "extensions/ai-research/**"
      - ".github/workflows/ai-research.yml"
      - ".dockerignore"
      - "server/main.py"
      - "server/model_router/ai_research_bridge.py"
      - "server/model_router/chat_control.py"
      - "server/model_router/chat_stable.py"
      - "server/model_router/cleanup_chat_receipts.py"
      - "server/model_router/repository.py"
      - "server/tests/test_ai_research_bridge.py"
      - "server/tests/test_provider_chat_stable_service.py"
  push:
    branches: [main]
    paths:
      - "extensions/ai-research/**"
      - ".dockerignore"
      - ".github/workflows/ai-research.yml"
      - "server/main.py"
      - "server/model_router/ai_research_bridge.py"
      - "server/model_router/chat_control.py"
      - "server/model_router/chat_stable.py"
      - "server/model_router/cleanup_chat_receipts.py"
      - "server/model_router/repository.py"
      - "server/tests/test_ai_research_bridge.py"
      - "server/tests/test_provider_chat_stable_service.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Candidate routing (not trust authority)
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      kind: ${{ steps.scope.outputs.kind }}
      base: ${{ steps.scope.outputs.base }}
      candidate: ${{ steps.scope.outputs.candidate }}
    steps:
      - name: Check out exact candidate for ordinary CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Route using the base reviewer without a candidate fallback
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BASE_SHA" =~ ^0+$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          reviewer="$RUNNER_TEMP/base-trust-review.py"
          if ! git --no-replace-objects show "$BASE_SHA:extensions/ai-research/scripts/trust_review.py" > "$reviewer"; then
            echo "bootstrap_required: base_reviewer_missing; maintainer governance review required" >&2
            exit 1
          fi
          python3 -I -S -B "$reviewer" scope --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --candidate "$CANDIDATE_SHA" --output "$RUNNER_TEMP/scope.json"
          python3 -I -S -c 'import json,sys; print("kind=" + json.load(open(sys.argv[1]))["kind"])' "$RUNNER_TEMP/scope.json" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

  verify:
    name: Boundary, literature contracts, images, and fixture smoke
    needs: classify
    if: github.event_name != 'pull_request_target' && needs.classify.outputs.kind == 'functional'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.classify.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve comparison base and enforce trusted scope
        id: comparison-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) comparison_base="$PULL_REQUEST_BASE_SHA" ;;
            push) comparison_base="$PUSH_BEFORE_SHA" ;;
            *)
              echo "unsupported workflow event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [[ -z "$comparison_base" || "$comparison_base" =~ ^0+$ ]]; then
            echo "comparison base is missing or all-zero" >&2
            exit 1
          fi
          comparison_base=$(git rev-parse --verify "${comparison_base}^{commit}")
          if ! git merge-base --is-ancestor "$comparison_base" HEAD; then
            echo "comparison base is not an ancestor of HEAD: $comparison_base" >&2
            exit 1
          fi
          python3 -I -S - "$comparison_base" <<'PY'
          import json
          import re
          import subprocess
          import sys

          base = sys.argv[1]
          module_prefix = "extensions/ai-research/"
          trust_files = {
              "extensions/ai-research/source-lock.json",
              "extensions/ai-research/module-boundary.json",
          }

          def git(*args: str) -> bytes:
              return subprocess.run(
                  ["git", *args], check=True, capture_output=True
              ).stdout

          try:
              source_lock = json.loads(
                  git("show", f"{base}:extensions/ai-research/source-lock.json")
              )
              boundary = json.loads(
                  git("show", f"{base}:extensions/ai-research/module-boundary.json")
              )
          except (subprocess.CalledProcessError, json.JSONDecodeError) as exc:
              raise SystemExit("trusted AI Research configuration cannot be loaded from Base") from exc

          if not isinstance(source_lock, dict) or not isinstance(boundary, dict):
              raise SystemExit("trusted AI Research configuration must contain JSON objects")
          locked = source_lock.get("modelMirrorBaseCommit")
          if not isinstance(locked, str) or not re.fullmatch(r"[0-9a-f]{40}", locked):
              raise SystemExit("trusted source-lock commit is invalid")
          if boundary.get("baseCommit") != locked:
              raise SystemExit("trusted module boundary and source lock disagree")
          if subprocess.run(
              ["git", "merge-base", "--is-ancestor", locked, base]
          ).returncode != 0:
              raise SystemExit("comparison Base diverged from the locked AI Research source")

          allowed_value = boundary.get("allowedParentFiles")
          if not isinstance(allowed_value, list) or not all(
              isinstance(path, str) and path for path in allowed_value
          ):
              raise SystemExit("trusted allowedParentFiles is invalid")

          def normalized_relative_paths(values: object, label: str) -> set[str]:
              if not isinstance(values, (list, tuple, set)) or not all(
                  isinstance(path, str) and path for path in values
              ):
                  raise SystemExit(f"trusted {label} is invalid")
              normalized: set[str] = set()
              for path in values:
                  if "\\" in path:
                      raise SystemExit(f"trusted {label} contains an unsafe path")
                  candidate = path
                  parts = candidate.split("/")
                  if (
                      candidate.startswith("/")
                      or re.match(r"^[A-Za-z]:/", candidate)
                      or any(part in {"", ".", ".."} for part in parts)
                  ):
                      raise SystemExit(f"trusted {label} contains an unsafe path")
                  normalized.add(candidate)
              return normalized

          allowed_parent = normalized_relative_paths(
              allowed_value, "allowedParentFiles"
          )

          core_baseline = source_lock.get("coreBaseline")
          if not isinstance(core_baseline, dict):
              raise SystemExit("trusted coreBaseline is invalid")
          tracked = core_baseline.get("trackedFiles")
          if not isinstance(tracked, dict) or not tracked or not all(
              isinstance(path, str) and path for path in tracked
          ):
              raise SystemExit("trusted protected-file list is invalid")
          protected = normalized_relative_paths(
              list(tracked), "protected-file list"
          )

          changed_raw = git(
              "diff",
              "--name-only",
              "-z",
              "--no-renames",
              "--diff-filter=ACDMRTUXB",
              base,
              "HEAD",
              "--",
          )
          try:
              changed = {
                  path.decode("utf-8")
                  for path in changed_raw.split(b"\0")
                  if path
              }
          except UnicodeDecodeError as exc:
              raise SystemExit("current-batch paths are not valid UTF-8") from exc
          if any("\\" in path for path in changed):
              raise SystemExit("current-batch paths contain an unsafe backslash")

          changed_trust = sorted(changed & trust_files)
          if changed_trust:
              raise SystemExit(f"AI Research trust configuration changed: {changed_trust}")
          forbidden = sorted(
              path
              for path in changed
              if not path.startswith(module_prefix) and path not in allowed_parent
          )
          if forbidden:
              raise SystemExit(f"forbidden current-batch paths changed: {forbidden}")
          changed_protected = sorted(changed & protected)
          if changed_protected:
              raise SystemExit(f"protected core files changed: {changed_protected}")
          PY
          echo "comparison_base=$comparison_base" >> "$GITHUB_OUTPUT"
      - name: Set up Docker 29.7.2 with containerd image store
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5
        with:
          version: v29.7.2
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.13"
      - name: Install core server test dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Verify restricted model bridge
        run: python -m pytest server/tests/test_ai_research_bridge.py server/tests/test_provider_chat_stable_service.py -q
      - name: Verify V0.1 development candidate
        working-directory: extensions/ai-research
        run: bash scripts/verify.sh "${{ steps.comparison-base.outputs.comparison_base }}" full external-pull
      - name: Preserve module logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-research-v0-1-diagnostics
          path: extensions/ai-research/runtime/diagnostics
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop optional module without deleting evidence volumes
        if: always()
        working-directory: extensions/ai-research
        run: docker compose -f compose.yml --profile literature down

  trust-tests:
    name: Trust candidate tests (${{ matrix.platform }}, not promotion)
    needs: classify
    if: github.event_name != 'pull_request_target' && (needs.classify.outputs.kind == 'path_order' || needs.classify.outputs.kind == 'diagnostics')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact candidate for observational tests only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.classify.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python for observational tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.13"
      - name: Load test dependencies and recorder from base Git blobs
        env:
          BASE_SHA: ${{ needs.classify.outputs.base }}
        run: |
          python -I -S -B -c 'import os,pathlib,re,subprocess; b=os.environ["BASE_SHA"]; assert re.fullmatch("[0-9a-f]{40}",b); p=pathlib.Path(os.environ["RUNNER_TEMP"]); [(p / name).write_bytes(subprocess.run(["git","--no-replace-objects","show",b+":extensions/ai-research/"+src],check=True,capture_output=True).stdout) for name,src in [("base-test.lock","requirements-test.lock"),("base-trust-review.py","scripts/trust_review.py")]]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -m pip install --require-hashes -r (Join-Path $env:RUNNER_TEMP 'base-test.lock')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run narrow tests and bind their untrusted observation
        id: tests
        working-directory: extensions/ai-research
        env:
          BASE_SHA: ${{ needs.classify.outputs.base }}
          CANDIDATE_SHA: ${{ needs.classify.outputs.candidate }}
          TEST_PLATFORM: ${{ matrix.platform }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'trust-tests'
          New-Item -ItemType Directory -Path $evidence -ErrorAction Stop | Out-Null
          $junit = Join-Path $evidence 'result.xml'
          $shortRoot = if ($IsWindows) { 'C:\' } else { $env:RUNNER_TEMP }
          $testRoot = Join-Path $shortRoot ("atr-" + [guid]::NewGuid().ToString('N').Substring(0, 8))
          python -I -B -m pytest tests/control/test_zero_footprint_base.py tests/control/test_trusted_full_bootstrap.py tests/control/test_boundary_base.py tests/control/test_trust_review.py -q -rs -p no:cacheprovider --basetemp $testRoot --junitxml $junit 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'pytest.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -S -B (Join-Path $env:RUNNER_TEMP 'base-trust-review.py') record-tests --repo $env:GITHUB_WORKSPACE --base $env:BASE_SHA --candidate $env:CANDIDATE_SHA --platform $env:TEST_PLATFORM --junit $junit --output (Join-Path $evidence 'metadata.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve candidate test observations (never consumed by trusted event)
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-research-trust-tests-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/trust-tests/result.xml
            ${{ runner.temp }}/trust-tests/metadata.json
          if-no-files-found: error
          retention-days: 7

  base-trust-review:
    name: Base-owned route and trust scope (not promotion)
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out base only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up isolated reviewer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.13"
      - name: Inspect head as Git objects without checking it out
        id: scope
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          git --no-replace-objects fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          [[ "$(git --no-replace-objects rev-parse FETCH_HEAD)" == "$CANDIDATE_SHA" ]]
          reviewer="$RUNNER_TEMP/base-trust-review.py"
          if ! git --no-replace-objects show "$BASE_SHA:extensions/ai-research/scripts/trust_review.py" > "$reviewer"; then
            echo "bootstrap_required: base_reviewer_missing; maintainer governance review required" >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/trusted-evidence"
          python3 -I -S -B "$reviewer" scope --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --candidate "$CANDIDATE_SHA" --output "$RUNNER_TEMP/trusted-evidence/scope.json"
          python3 -I -S -c 'import json,sys; r=json.load(open(sys.argv[1])); print("kind="+r["kind"]); print("source="+r["lockedSourceCommit"])' "$RUNNER_TEMP/trusted-evidence/scope.json" >> "$GITHUB_OUTPUT"
      - name: Build only the base-locked historical source, never candidate code
        if: steps.scope.outputs.kind == 'path_order' || steps.scope.outputs.kind == 'diagnostics'
        env:
          LOCKED_SOURCE: ${{ steps.scope.outputs.source }}
        run: |
          [[ "$LOCKED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          context=$(mktemp -d "$RUNNER_TEMP/trust-source.XXXXXXXX")
          git --no-replace-objects archive --format=tar "$LOCKED_SOURCE" client > "$context/source.tar"
          tar -xf "$context/source.tar" -C "$context"
          git --no-replace-objects show "$BASE_SHA:extensions/ai-research/scripts/client-proof.Dockerfile" > "$context/Dockerfile"
          image="mmar-trust-source:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --platform linux/amd64 --no-cache --target proof -t "$image" "$context"
          cid=$(docker create --network none "$image")
          trap 'docker rm "$cid" >/dev/null' EXIT
          mkdir "$RUNNER_TEMP/source-dist"
          docker cp "$cid:/proof/dist/." "$RUNNER_TEMP/source-dist"
          python3 -I -S -B "$RUNNER_TEMP/base-trust-review.py" source-proof --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --candidate "$CANDIDATE_SHA" --source-client-dist "$RUNNER_TEMP/source-dist" --output "$RUNNER_TEMP/trusted-evidence/source-proof.json"
      - name: Preserve base-owned evidence, without candidate artifacts or caches
        if: always() && steps.scope.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-research-base-owned-scope-and-source
          path: ${{ runner.temp }}/trusted-evidence
          if-no-files-found: error
          retention-days: 7
