name: Multimodal readiness

on:
  pull_request:
    paths:
      - "client/src/data/models.ts"
      - "docs/multimodal-readiness.json"
      - "scripts/check-multimodal-readiness.mjs"
      - "server/multimodal/video_catalog.py"
  push:
    branches: [main]
    paths:
      - "client/src/data/models.ts"
      - "docs/multimodal-readiness.json"
      - "scripts/check-multimodal-readiness.mjs"
      - "server/multimodal/video_catalog.py"

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check multimodal readiness evidence
        run: node scripts/check-multimodal-readiness.mjs
