<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>型月大世界 · 世界书审核</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f0;color:#272e35;font:16px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:28px 20px 60px}h1{font-size:1.85rem;line-height:1.3}h2{font-size:1.15rem;margin-top:1.8em}a{color:#275e69}p{margin:8px 0 14px}input,textarea,button{font:inherit}input,textarea{padding:9px 12px;border:1px solid #9ba7ac;border-radius:5px;background:#fff;color:inherit;width:100%}button{cursor:pointer;border:1px solid #315664;border-radius:5px;background:#2d5360;color:white;padding:6px 15px}button:hover,button:focus-visible{background:#183e49}textarea{display:block;margin:6px 0 9px;resize:vertical}.entries{border:1px solid #c2c9c5;border-radius:5px;background:white;max-height:15rem;overflow:auto;margin:8px 0}.row{display:block;width:100%;background:transparent;color:inherit;border:0;border-radius:0;border-bottom:1px solid #ededed;text-align:left;padding:6px 11px}.row:hover,.row:focus-visible{background:#e3eeec;color:#173f48}.anchor{font:13px monospace;color:#526362;margin-right:10px}.hit{border-top:1px solid #bac4c1;padding:9px 0}pre{font:15px/1.65 system-ui,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer}label{font-weight:600}#resultNote{color:#264c57}
</style></head><body><main><a href="/rpg-app/type-moon/chat/">返回型月大世界</a><h1>世界书审核</h1><p>点击条目可试用它的触发词，也可以输入一句开局或行动。P 表示 Word 原稿段号。此页使用本机装配器，显示本轮实际插入的正文。</p>
<label for="find">查找名称、编号或触发词</label><input id="find" type="search" placeholder="例如 阿尔托莉雅、时钟塔、No.461"><div id="rows" class="entries"></div>
<h2>试触发</h2><form id="form"><label for="input">当前回合文本</label><textarea id="input" rows="2" maxlength="2000">FGO，藤丸立香在时钟塔查阅图鉴 No.3。</textarea><button>查看装配结果</button></form>
<p id="resultNote" aria-live="polite"></p><div id="hits"></div>
<details><summary>展开本轮完整系统提示词</summary><pre id="full"></pre></details>
</main><script>
const byId=id=>document.getElementById(id);
const el=(tag,text)=>{const node=document.createElement(tag);node.textContent=text;return node;};
let catalog=[],runId=0;
function filter(){const needle=byId('find').value.trim().toLowerCase();const rows=document.createDocumentFragment();for(const e of catalog){if(![e.title,...e.keys].join(' ').toLowerCase().includes(needle))continue;const b=el('button','');b.type='button';b.className='row';const anchor=el('span',e.anchor);anchor.className='anchor';b.append(anchor,document.createTextNode(e.title));b.onclick=()=>{byId('input').value=e.query;run();};rows.append(b);}byId('rows').replaceChildren(rows);}
async function run(){const id=++runId,q=byId('input').value.trim();if(!q){byId('hits').replaceChildren();byId('full').textContent='';byId('resultNote').textContent='请输入回合文本。';return;}try{const response=await fetch('/type-moon-review/run?'+new URLSearchParams({input:q}));const r=await response.json();if(id!==runId)return;if(!response.ok)throw Error(r.error);byId('resultNote').textContent='命中 '+r.entries.length+' 条，固定提示词 '+r.baseLength.toLocaleString()+' 字符，本轮 '+r.system.length.toLocaleString()+' 字符。';byId('full').textContent=r.system;const hits=document.createDocumentFragment();for(const e of r.entries){const d=el('details','');d.className='hit';d.append(el('summary','P'+e.slot+'　'+e.title));if(e.scope)d.append(el('p','适用时间线　'+e.scope));const keys=el('details','');keys.append(el('summary','查看配置的触发写法'),el('p',e.keys.join(' ／ ')));d.append(keys,el('pre',e.body));for(const [label,url] of e.sources||[]){const a=el('a',label);a.href=url;a.target='_blank';a.rel='noreferrer';d.append(a,document.createTextNode('　'));}hits.append(d);}byId('hits').replaceChildren(hits);}catch(e){if(id===runId)byId('resultNote').textContent=String(e.message);}}
byId('find').oninput=filter;byId('form').onsubmit=e=>{e.preventDefault();run();};fetch('/type-moon-review/catalog').then(r=>r.json()).then(r=>{catalog=r;filter();run();}).catch(()=>byId('resultNote').textContent='读取审核目录失败。');
</script></body></html>
