<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会话与玩家档案 · 模镜</title><link rel="stylesheet" href="/character-assets/editor.css"><link rel="stylesheet" href="/character-assets/daily/page.css"><script type="module" src="/character-assets/daily/page.mjs"></script></head><body class="daily-page"><a class="skip-link" href="#daily-main">跳到主要内容</a><header class="workspace-header"><strong>模镜 · 角色工作台</strong><nav aria-label="工作台导航"><a href="/characters">角色库与创作</a><a href="/characters?desk=sessions" id="nav-sessions">会话</a><a href="/characters?desk=profiles" id="nav-profiles">玩家档案</a></nav></header><main id="daily-main"><div id="daily-status" role="status"></div><div id="daily-error" role="alert" hidden></div>
<section id="sessions-panel"><div class="daily-heading"><div><h1>我的会话</h1><p>找到之前的对话，继续与角色相遇。</p></div><a href="/characters">选择角色开始</a></div><form id="search-form" class="daily-filters"><label>查找会话<input id="query" type="search" maxlength="200" placeholder="标题、成员或聊天正文"></label><label>会话类型<select id="kind"><option value="all">全部</option><option value="single">单角色</option><option value="group">群聊</option></select></label><label>显示<select id="archived"><option value="false">进行中的会话</option><option value="true">已归档</option></select></label><button class="primary">查找</button></form><div id="session-list"></div></section>
<section id="profiles-panel" hidden><div class="daily-heading"><div><h1>玩家档案</h1><p>保存你在故事中的身份。新对话使用创建时的快照，旧对话不变。</p></div><button id="new-profile" class="primary">新建档案</button></div><div class="daily-columns"><aside id="profile-list" aria-label="已保存档案"></aside><form id="profile-form"><h2 id="profile-title">新建玩家档案</h2><label>称呼<input id="profile-name" maxlength="120" required autocomplete="off"></label><label>公开人物描述<textarea id="profile-description" rows="7" maxlength="8000" placeholder="例如：一位喜欢绘制地图的旅人。只写身份设定，不写已经完成的行动。"></textarea></label><div class="daily-avatar"><img id="avatar-preview" alt="玩家头像" hidden><label>本地静态头像<input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="remove-avatar" type="button">移除头像</button></div><p class="hint">头像仅用于显示，不发送给模型。PNG / JPEG / WebP，上限 5 MiB，自动缩小保存。</p><p id="profile-revision" class="hint">保存后可在创建对话时选择。</p><button type="submit" class="primary">保存档案</button></form></div></section>
<dialog id="rename-dialog"><form id="rename-form"><h2>命名会话</h2><label>会话名称<input id="session-title" maxlength="120"></label><div class="daily-actions"><button type="submit" class="primary">保存名称</button><button id="cancel-rename" type="button">取消</button></div></form></dialog>
</main></body></html>
