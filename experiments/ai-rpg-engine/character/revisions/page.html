<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会话续写 · 模镜</title><link rel="stylesheet" href="/revisions.css"><script type="module" src="/revisions.mjs"></script></head><body>
<a class="skip" href="#main">跳到对话</a><header><strong>模镜 · 角色工作台</strong><nav aria-label="工作台导航"><a id="library">角色库与创作</a><a id="sessions">会话</a><a id="profiles">玩家档案</a><a id="groups">群聊</a><a href="/revisions" aria-current="page">续写分支</a></nav></header>
<main id="main"><div class="heading"><div><h1>让故事换一种走向</h1><p>修改一句话，或选择另一种回应。原来的故事一直保留。</p></div><span id="mode" class="mode">离线预览 · 不调用模型</span></div>
<p id="status" role="status"></p><p id="error" role="alert" hidden></p>
<section id="library-panel"><h2>选择一段对话</h2><div id="source-list"></div></section>
<section id="conversation" hidden><div class="branchbar"><button id="back">← 所有会话</button><label>当前分支<select id="branch-select"></select></label><a id="source-link">查看原会话</a><label>导出格式<select id="export-format"><option value="txt">TXT</option><option value="md">Markdown</option></select></label><button id="export">导出当前分支</button><label>本次生成模型<select id="model"><option value="">沿用原设置</option></select></label></div><div class="layout"><section aria-label="对话记录"><div id="messages"></div><form id="composer"><label for="input">继续对话</label><textarea id="input" rows="3" maxlength="100000" placeholder="写下你想说的话…"></textarea><div class="compose-actions"><label>回应者<select id="target"></select></label><button class="primary" id="send">发送并生成候选</button><button type="button" id="continue">让角色接话</button></div><p class="hint">候选完成后，选择“采用这条”才会进入后续故事。</p></form></section><aside><h2>本次身份</h2><p id="identity"></p><h2>生成记录</h2><p id="budget"></p><div id="requests"></div><details><summary>续写使用的资料</summary><p class="hint">来源不明或受改写影响的资料暂不用于续聊。</p><div id="derived"></div></details><h2>比较回复</h2><p class="hint">按回复位置比较。展开只预览；采用后才用于续聊。切换本次模型不会更改成员的默认模型。</p><div id="candidates"></div></aside></div></section>
</main><dialog id="edit-dialog" aria-labelledby="edit-title"><form id="edit-form"><h2 id="edit-title">修改这条消息</h2><p>保存后从这里开一条新分支，原回复和后续对话留在原路径。</p><label>修改正文<textarea id="edit-content" rows="8" maxlength="100000" required></textarea></label><label>分支名称<input id="branch-title" maxlength="120" value="修改后的故事" required></label><div class="dialog-actions"><button type="button" id="cancel-edit">取消</button><button class="primary">保存并从这里继续</button></div></form></dialog>
<dialog id="original-dialog" aria-labelledby="original-title"><h2 id="original-title">原文与来源</h2><pre id="original-text"></pre><button id="close-original">关闭</button></dialog>
</body></html>
