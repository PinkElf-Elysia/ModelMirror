<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关宁驿图 · 古代人生</title><style>
*{box-sizing:border-box}body{background:#ede8d9;color:#2c342e;font:16px/1.6 system-ui;margin:auto;max-width:960px;padding:4vw}h1,h2{font-family:STKaiti,serif}button,select{font:inherit;padding:.55em 1em;margin:3px;border:1px solid #959983;border-radius:5px;background:#fffaf0;color:inherit;cursor:pointer}button:hover,button:focus{border-color:#915334;background:#f8e2bc}section,article{background:#faf7ed;border:1px solid #ccc3a9;border-radius:8px;padding:1em;margin:1em 0}#map{position:relative;height:220px;background:linear-gradient(145deg,#dae1ce 47%,#cddcda 48%);border-radius:5px}#map button{position:absolute;transform:translate(-50%,-50%)}#map button[aria-pressed=true]{background:#314a40;color:white}iframe{width:100%;height:70vh;border:0}small{color:#5c645b}dialog{max-width:90vw}#error{color:#a22}</style>
<h1>关宁驿图</h1><p>古代人生模拟器　·　崇祯元年七月</p><details id="start" open><summary>选择开局或读档</summary><p>以本月明廷防区为起点，后续在各自存档内推演。</p><button data-p="soldier">辽东士兵</button><button data-p="court">崇祯帝</button><button id="original">从原卡命运卷轴开局</button><select id="saves"><option>选择已保存的角色</option></select><div id="card"></div></details><p id="error" role="alert"></p>
<main hidden><h2 id="role"></h2><small>京师—辽东节点示意 · 距离不按比例</small><div id="map"></div><article><strong id="node"></strong><ul id="sources"></ul></article><section><h2>行记</h2><p id="intro"></p><ol id="log"></ol><section hidden id="agent"><h2>地图叙事 · 离线模拟</h2><select id="sample"><option>我现在能确认宁远的情况吗？</option><option>把听来的失城消息记为传闻。</option><option>先拟宁远城防移交之旨。</option><option>请依据收到的接防回执核对交割。</option></select><input id="words" aria-label="回合输入"><button id="talk">发送回合</button><p id="proposal"></p><details><summary>工具轨迹与事件依据</summary><pre id="trace" style="white-space:pre-wrap"></pre></details></section><div id="actions"></div><button id="branch">从本局开场另存分支</button></section></main><dialog><p id="prompt"></p><button id="yes">确认</button><button id="no">返回</button></dialog><footer>历史开局依据《明史》卷二百五十九《袁崇焕传》。递报路径、人物差事及后续决策为本档离线推演。</footer><script>
const el=id=>document.getElementById(id),main=document.querySelector('main'),dlg=document.querySelector('dialog');let v,selected='宁远',pending;
const make=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};
async function api(path,data){const r=await fetch(path,data?{method:'POST',headers:{'x-map-preview':'1','content-type':'application/json'},body:JSON.stringify(data)}:{});const x=await r.json();if(!r.ok)throw Error(x.error||'无法读取记录');return x}
function guard(fn){return async()=>{try{el('error').textContent='';await fn()}catch(e){el('error').textContent=e.message}}}
function confirmText(text,fn){pending=fn;el('prompt').textContent=text;dlg.showModal()}
el('no').onclick=()=>dlg.close();el('yes').onclick=guard(async()=>{dlg.close();await pending()});
const list=JSON.parse(localStorage.getItem('guanning-v1')||'{}');function menu(){el('saves').length=1;for(const [id,name] of Object.entries(list))el('saves').add(new Option(name+' · '+id.slice(-6),id))}
async function load(id){v=await api('/runs/'+id);history.replaceState(null,'','?run='+id);el('start').open=false;main.hidden=false;list[id]=v.person.name;localStorage.setItem('guanning-v1',JSON.stringify(list));menu();render()}
function begin(preset,scroll){confirmText('从崇祯元年七月开始这份独立存档？'+(scroll?'\n'+scroll:''),async()=>load((await api('/runs',{preset,scroll})).id))}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>begin(b.dataset.p));el('saves').onchange=guard(()=>load(el('saves').value));
el('original').onclick=()=>{const f=document.createElement('iframe');f.src='/opening?chat=1';f.title='古代人生原卡开局';el('card').replaceChildren(f)};
window.onmessage=e=>{if(e.origin===location.origin&&e.source===el('card').firstChild?.contentWindow&&e.data?.type==='ancient-opening')begin('scroll',e.data.text)};
el('sample').onchange=()=>el('words').value=el('sample').value;el('words').value=el('sample').value;el('talk').onclick=guard(async()=>{v=await api('/runs/'+v.id,{revision:v.revision,action:'turn',input:el('words').value});render()});function render(){el('agent').hidden=!v.agent;if(v.agent){el('trace').textContent=JSON.stringify(v.agent,null,2);el('talk').disabled=!!v.agent.pending;el('proposal').textContent=v.agent.pending?'待确认 · 宁远 · '+({draft:'拟定移交旨意，城防仍归明',handover:'已核接防回执，确认后明 → 后金'}[v.agent.pending.kind]):'';}el('role').textContent=v.person.name;el('map').replaceChildren();const positions=[[12,78],[37,58],[61,38],[84,20]];
v.places.forEach((p,i)=>{const b=make('button',p.name+' · '+p.control);b.style.left=positions[i][0]+'%';b.style.top=positions[i][1]+'%';b.setAttribute('aria-pressed',selected===p.name);b.onclick=()=>{selected=p.name;render()};el('map').append(b)});
const p=v.places.find(x=>x.name===selected);el('node').textContent=p.name+' · 最后所知控制方：'+p.control;el('sources').replaceChildren(...p.sources.map(s=>make('li',s)));
el('intro').textContent=v.person.role==='soldier'?'营中有人聚集，同袍说城已失。值守官在等你的报告。':v.person.role==='court'?'京师值房。按本地已收文书查看关外局势。':'此地只能查阅已经公开的消息。';
el('log').replaceChildren(...v.log.map(s=>make('li',s)));el('actions').replaceChildren();for(const [a,text] of Object.entries(v.options)){const b=make('button',text);b.onclick=()=>confirmText(text,async()=>{v=await api('/runs/'+v.id,{action:a,revision:v.revision});render()});el('actions').append(b)}}
el('branch').onclick=()=>confirmText('保留此档，从相同人物和开局另起一份记录？',async()=>load((await api('/runs/'+v.id+'/branch',{revision:v.revision})).id));menu();const id=new URLSearchParams(location.search).get('run');if(id)guard(()=>load(id))();
</script></html>
