      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      MODEL_ROUTER_DEFAULT: ${MODEL_ROUTER_DEFAULT:-newapi}
      OMNIROUTE_BUDGET_HEADERS_ENABLED: ${OMNIROUTE_BUDGET_HEADERS_ENABLED:-false}
      MODEL_ROUTER_ENGINE: ${MODEL_ROUTER_ENGINE:-}
      MODEL_ROUTER_CANARY_PERCENT: ${MODEL_ROUTER_CANARY_PERCENT:-0}
      MODEL_ROUTER_ALLOW_NATIVE_OVERRIDE: ${MODEL_ROUTER_ALLOW_NATIVE_OVERRIDE:-false}
      MODEL_ROUTER_STORAGE_DIR: /app/model_router/storage
      FILE_ASSET_STORE_MODE: ${FILE_ASSET_STORE_MODE:-legacy}
      FILE_ASSET_STORAGE_DIR: /app/file_assets/storage
      CHAT_FILE_INPUT_ENABLED: ${CHAT_FILE_INPUT_ENABLED:-false}
      CHAT_ONE_SHOT_VISION_ENABLED: ${CHAT_ONE_SHOT_VISION_ENABLED:-false}
      CHAT_OPENROUTER_OCR_ENABLED: ${CHAT_OPENROUTER_OCR_ENABLED:-false}
      WORKFLOW_FILE_ASSETS_ENABLED: ${WORKFLOW_FILE_ASSETS_ENABLED:-false}
      EXPERT_TEAM_AGENCY_PLANNER_ENABLED: ${EXPERT_TEAM_AGENCY_PLANNER_ENABLED:-0}
      EXPERT_TEAM_AGENCY_PLANNER_TIMEOUT_SECONDS: ${EXPERT_TEAM_AGENCY_PLANNER_TIMEOUT_SECONDS:-450}
      EXPERT_TEAM_AGENCY_EXECUTION_ENABLED: ${EXPERT_TEAM_AGENCY_EXECUTION_ENABLED:-0}
      EXPERT_TEAM_AGENCY_REVISION_ENABLED: ${EXPERT_TEAM_AGENCY_REVISION_ENABLED:-0}
      EXPERT_TEAM_AGENCY_HITL_ENABLED: ${EXPERT_TEAM_AGENCY_HITL_ENABLED:-0}
      FILE_OUTPUT_ASSETS_ENABLED: ${FILE_OUTPUT_ASSETS_ENABLED:-false}
      CHAT_FILE_OUTPUT_TOOL_ENABLED: ${CHAT_FILE_OUTPUT_TOOL_ENABLED:-false}
      WORLD_PROVIDER: ${WORLD_PROVIDER:-mock}
      WORLD_LABS_API_KEY: ${WORLD_LABS_API_KEY:-}
      WORLD_STORAGE_DIR: /app/world/storage/world_records.json
      MODELMIRROR_DEFAULT_TENANT_ID: ${MODELMIRROR_DEFAULT_TENANT_ID:-local}
      MODELMIRROR_DEFAULT_OWNER_ID: ${MODELMIRROR_DEFAULT_OWNER_ID:-local}
      MODEL_MIRROR_REQUIRE_EXTERNAL_CREDENTIAL_MASTER_KEY: ${MODEL_MIRROR_REQUIRE_EXTERNAL_CREDENTIAL_MASTER_KEY:-false}
      MODEL_MIRROR_CREDENTIAL_MASTER_KEY: ${MODEL_MIRROR_CREDENTIAL_MASTER_KEY:-}
      MODEL_MIRROR_PROVIDER_ADMIN_PAIRING_SECRET: ${MODEL_MIRROR_PROVIDER_ADMIN_PAIRING_SECRET:-}
      MODEL_MIRROR_PROVIDER_INTERNAL_ALLOWLIST: ${MODEL_MIRROR_PROVIDER_INTERNAL_ALLOWLIST:-}
      MODEL_MIRROR_PROVIDER_CHAT_CERTIFICATION_ENABLED: ${MODEL_MIRROR_PROVIDER_CHAT_CERTIFICATION_ENABLED:-true}
      MODEL_MIRROR_PROVIDER_CHAT_CERTIFICATION_MAX_AGE_SECONDS: ${MODEL_MIRROR_PROVIDER_CHAT_CERTIFICATION_MAX_AGE_SECONDS:-86400}
      MODEL_MIRROR_PROVIDER_CHAT_CANARY_ENABLED: ${MODEL_MIRROR_PROVIDER_CHAT_CANARY_ENABLED:-false}
      MODEL_CONTROL_CHAT_ENABLED: ${MODEL_CONTROL_CHAT_ENABLED:-false}
      RAG_STORAGE_DIR: /app/rag/storage
      RAG_UPLOAD_DIR: /app/rag/uploads
      RERANK_API_URL: ${RERANK_API_URL:-}
      RERANK_API_BASE: ${RERANK_API_BASE:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RAG_RERANK_LLM_MODEL: ${RAG_RERANK_LLM_MODEL:-}
      RAG_RERANK_MAX_CANDIDATES: ${RAG_RERANK_MAX_CANDIDATES:-20}
      RAG_RERANK_MAX_INPUT_CHARS: ${RAG_RERANK_MAX_INPUT_CHARS:-24000}
      RAG_RERANK_TIMEOUT_SECONDS: ${RAG_RERANK_TIMEOUT_SECONDS:-5}
      CHROMA_DB_PATH: /app/rag/storage/chroma_db
      SKILL_INSTALLED_DIR: /app/skills/installed
      SKILL_TMP_DIR: /app/skills/tmp
      SKILL_LOCAL_IMPORT_ENABLED: ${SKILL_LOCAL_IMPORT_ENABLED:-true}
      SKILL_LOCAL_IMPORT_STORAGE_DIR: /app/skills/imports
      SKILL_LIFECYCLE_ENABLED: ${SKILL_LIFECYCLE_ENABLED:-true}
      SKILL_LIFECYCLE_STORAGE_DIR: /app/skills/lifecycle
      SKILL_LIFECYCLE_MAX_VERSIONS: ${SKILL_LIFECYCLE_MAX_VERSIONS:-5}
      SKILL_LIFECYCLE_MAX_BYTES: ${SKILL_LIFECYCLE_MAX_BYTES:-1073741824}
      SKILL_RERANK_STORAGE_DIR: /app/skills/storage
      AGENT_WORKSPACE_ENABLED: ${AGENT_WORKSPACE_ENABLED:-true}
      AGENT_APP_ENGINE_SHADOW_ENABLED: ${AGENT_APP_ENGINE_SHADOW_ENABLED:-false}
      AGENT_WORKSPACE_ROOT: /data/agent-workspace
      XPERT_STORAGE_DIR: /app/xperts/storage
      AGENT_TASK_STORAGE_DIR: /app/xpert_runtime/storage
      WORKFLOW_FAILURE_TRIGGERS_ENABLED: ${WORKFLOW_FAILURE_TRIGGERS_ENABLED:-false}
      WORKFLOW_SUBWORKFLOWS_ENABLED: ${WORKFLOW_SUBWORKFLOWS_ENABLED:-false}
      WORKFLOW_HTTP_REQUESTS_ENABLED: ${WORKFLOW_HTTP_REQUESTS_ENABLED:-false}
      AGENT_TABLE_STORAGE_DIR: /app/xpert_runtime/storage
      DATAX_STORAGE_DIR: /app/datax/storage
      TOOLSET_STORAGE_DIR: /app/toolsets/storage
      HANDOFF_EXECUTOR_ENABLED: "true"
      HANDOFF_EXECUTOR_MAX_CONCURRENCY: "2"
      GOAL_COORDINATOR_ENABLED: "true"
      SANDBOX_SOCKET_PATH: /run/modelmirror-sandbox/sandbox.sock
      SANDBOX_WORKSPACE_ROOT: /app/sandbox-workspaces
      MCP_PUBLIC_SOCKET_PATH: /run/modelmirror-public-mcp/public-mcp.sock
      MCP_FILES_SOCKET_PATH: /run/modelmirror-files-mcp/files-mcp.sock
      MCP_TOKEN_SOCKET_PATH: /run/modelmirror-token-mcp/token-mcp.sock
      MCP_REGISTRY_SOCKET_PATH: /run/modelmirror-registry-mcp/registry-mcp.sock
      MCP_SAAS_SOCKET_PATH: /run/modelmirror-saas-mcp/saas-mcp.sock
      MCP_BROWSER_SOCKET_PATH: /run/modelmirror-browser-mcp/browser-mcp.sock
      MCP_BROWSER_ARTIFACT_STAGING_ROOT: /app/mcp-browser-staging
      MCP_BROWSER_TRUSTED_ARTIFACT_ROOT: /app/mcp/storage/browser-artifacts
      MCP_HUB_ENABLED: ${MCP_HUB_ENABLED:-false}
      MCP_HUB_REMOTE_ENABLED: ${MCP_HUB_REMOTE_ENABLED:-false}
      MCP_HUB_REVIEW_FACTORY_ENABLED: ${MCP_HUB_REVIEW_FACTORY_ENABLED:-false}
      MCP_HUB_LOCAL_CONTRACT_PUBLISH_ENABLED: ${MCP_HUB_LOCAL_CONTRACT_PUBLISH_ENABLED:-false}
      MCP_HUB_CONTRACT_SIGNING_KEY: ${MCP_HUB_CONTRACT_SIGNING_KEY:-}
      MCP_HUB_TRUSTED_CHANNEL_ENABLED: ${MCP_HUB_TRUSTED_CHANNEL_ENABLED:-false}
      MCP_HUB_AUTO_REVIEW_ENABLED: ${MCP_HUB_AUTO_REVIEW_ENABLED:-false}
      MCP_REMOTE_AUTH_ENABLED: ${MCP_REMOTE_AUTH_ENABLED:-false}
      MCP_REMOTE_STATIC_TOKEN_ENABLED: ${MCP_REMOTE_STATIC_TOKEN_ENABLED:-false}
      MCP_REMOTE_AUTH_LOCAL_SINGLE_OWNER_ACK: ${MCP_REMOTE_AUTH_LOCAL_SINGLE_OWNER_ACK:-false}
      MCP_HUB_REMOTE_SOCKET_PATH: /run/modelmirror-hub-mcp/hub-mcp.sock
      MCP_HUB_EGRESS_SOCKET_PATH: /run/modelmirror-hub-egress/hub-egress.sock
      MCP_LEGACY_UNRESTRICTED_CONNECT_ENABLED: ${MCP_LEGACY_UNRESTRICTED_CONNECT_ENABLED:-false}
      MCP_CATALOG_ENABLE_CHROME_DEVTOOLS_MCP: ${MCP_CATALOG_ENABLE_CHROME_DEVTOOLS_MCP:-false}
      MCP_CATALOG_ENABLE_PLAYWRIGHT_MCP: ${MCP_CATALOG_ENABLE_PLAYWRIGHT_MCP:-false}
      MCP_CATALOG_STATEFUL_SAAS_SINGLE_USER_ACK: ${MCP_CATALOG_STATEFUL_SAAS_SINGLE_USER_ACK:-false}
      MCP_CATALOG_ENABLE_AIRTABLE_MCP: ${MCP_CATALOG_ENABLE_AIRTABLE_MCP:-false}
      MCP_CATALOG_ENABLE_ASANA_MCP: ${MCP_CATALOG_ENABLE_ASANA_MCP:-false}
      MCP_CATALOG_ENABLE_GITLAB_MCP: ${MCP_CATALOG_ENABLE_GITLAB_MCP:-false}
      MCP_CATALOG_ENABLE_NOTION_MCP_SERVER: ${MCP_CATALOG_ENABLE_NOTION_MCP_SERVER:-false}
      MCP_DATABASE_SOCKET_PATH: /run/modelmirror-database-mcp/database-mcp.sock
      MCP_DATABASE_LOCAL_SOCKET_PATH: /run/modelmirror-database-local-mcp/database-mcp.sock
      MCP_CATALOG_STORAGE_DIR: /app/mcp/storage
      MCP_FILE_INPUT_ROOT: /app/mcp-file-inputs
      MCP_FILE_OUTPUT_ROOT: /app/mcp-file-outputs
      MCP_FILE_MEMORY_ROOT: /app/mcp-memory
      MCP_FILE_RUNTIME_UID: "65532"
      MCP_FILE_RUNTIME_GID: "65532"
      BROWSER_SOCKET_PATH: /run/modelmirror-browser/browser.sock
      BROWSER_DATA_ROOT: /app/browser-data
      CODING_AGENT_ENABLED: ${CODING_AGENT_ENABLED:-false}
      CODING_AGENT_MODE: ${CODING_AGENT_MODE:-readonly}
      CODING_AGENT_SOCKET_PATH: /run/modelmirror-coding/coding-runtime.sock
    ports:
      - "8000:8000"
    volumes:
      - ${MODELMIRROR_DATA_ROOT:-.}/server/rag/storage:/app/rag/storage
      - ${MODELMIRROR_DATA_ROOT:-.}/server/rag/uploads:/app/rag/uploads
      - ${MODELMIRROR_DATA_ROOT:-.}/server/skills/installed:/app/skills/installed
      - ${MODELMIRROR_DATA_ROOT:-.}/server/skills/imports:/app/skills/imports
      - ${MODELMIRROR_DATA_ROOT:-.}/server/skills/lifecycle:/app/skills/lifecycle
      - ${MODELMIRROR_DATA_ROOT:-.}/server/skills/storage:/app/skills/storage
      - agent_workspace_data:/data/agent-workspace
      - ${MODELMIRROR_DATA_ROOT:-.}/server/xperts/storage:/app/xperts/storage
      - ${MODELMIRROR_DATA_ROOT:-.}/server/xpert_runtime/storage:/app/xpert_runtime/storage
      - ${MODELMIRROR_DATA_ROOT:-.}/server/datax/storage:/app/datax/storage
      - ${MODELMIRROR_DATA_ROOT:-.}/server/toolsets/storage:/app/toolsets/storage
      - ${MODELMIRROR_DATA_ROOT:-.}/server/model_router/storage:/app/model_router/storage
      - ${MODELMIRROR_DATA_ROOT:-.}/server/file_assets/storage:/app/file_assets/storage
      - ${MODELMIRROR_DATA_ROOT:-.}/server/world/storage:/app/world/storage
      - ${MODELMIRROR_DATA_ROOT:-.}/server/mcp/storage:/app/mcp/storage
      - sandbox_socket:/run/modelmirror-sandbox
      - sandbox_workspaces:/app/sandbox-workspaces:ro
      - mcp_public_socket:/run/modelmirror-public-mcp
      - mcp_files_socket:/run/modelmirror-files-mcp
      - mcp_token_socket:/run/modelmirror-token-mcp
      - mcp_registry_socket:/run/modelmirror-registry-mcp
      - mcp_saas_socket:/run/modelmirror-saas-mcp
      - mcp_browser_socket:/run/modelmirror-browser-mcp
      - mcp_browser_artifact_staging:/app/mcp-browser-staging
      - mcp_hub_remote_socket:/run/modelmirror-hub-mcp
      - mcp_hub_egress_socket:/run/modelmirror-hub-egress
      - mcp_database_socket:/run/modelmirror-database-mcp
      - mcp_database_local_socket:/run/modelmirror-database-local-mcp
      - mcp_file_inputs:/app/mcp-file-inputs
      - mcp_file_outputs:/app/mcp-file-outputs
      - mcp_memory:/app/mcp-memory
      - browser_socket:/run/modelmirror-browser
      - browser_data:/app/browser-data:ro
      - coding_socket:/run/modelmirror-coding
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  client:
    build:
      context: ./client
    container_name: modelmirror-client
    environment:
      NEWAPI_WEB_URL: ${NEWAPI_WEB_URL:-}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

  coding-runtime:
    profiles:
      - coding
    build:
      context: .
      dockerfile: server/coding_worker/Dockerfile
    container_name: modelmirror-coding-runtime
    env_file:
      - path: ${MODELMIRROR_DATA_ROOT:-.}/server/.env
        required: false
    networks:
      - coding_internal
      - coding_provider
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,uid=65532,gid=65532,mode=0700
      - /home/coding:rw,nosuid,noexec,size=256m,uid=65532,gid=65532,mode=0700
      - /workspace:rw,nosuid,noexec,size=256m,uid=65532,gid=65532,mode=0700
    environment:
      CODING_AGENT_SOCKET_PATH: /run/modelmirror-coding/coding-runtime.sock
      CODING_VERIFIER_SOCKET_PATH: /run/modelmirror-coding/verifier.sock
      CODING_AGENT_MODE: ${CODING_AGENT_MODE:-readonly}
      CODING_AGENT_MODEL: ${CODING_AGENT_MODEL:-}
      CODING_AGENT_MODEL_BASE_URL: ${CODING_AGENT_MODEL_BASE_URL:-}
      CODING_FILE_OPERATIONS_ENABLED: ${CODING_FILE_OPERATIONS_ENABLED:-true}
    volumes:
      - coding_socket:/run/modelmirror-coding
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/modelmirror-coding/coding-runtime.sock'); s.sendall(b'{\"action\":\"health\"}\\n'); assert json.loads(s.recv(4096))['ok']",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  coding-verifier:
    profiles:
      - coding-verify
    build:
      context: .
      dockerfile: server/coding_verifier/Dockerfile
    container_name: modelmirror-coding-verifier
    network_mode: none
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 3g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=128m,uid=65532,gid=65532,mode=0700
      - /home/verifier:rw,nosuid,noexec,size=64m,uid=65532,gid=65532,mode=0700
      - /workspace:rw,nosuid,noexec,size=1g,uid=65532,gid=65532,mode=0700
    environment:
      CODING_VERIFIER_SOCKET_PATH: /run/modelmirror-coding/verifier.sock
    volumes:
      - coding_socket:/run/modelmirror-coding
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/modelmirror-coding/verifier.sock'); s.sendall(b'{\"action\":\"health\"}\\n'); assert json.loads(s.recv(4096))['ok']",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  office-host:
    profiles:
      - office
    build:
      context: ./server
      dockerfile: office_host/Dockerfile
    container_name: modelmirror-office-host
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8443:8443"
    volumes:
      - type: bind
        source: ${MODELMIRROR_DATA_ROOT:-.}/server/office_host/certs
        target: /certs
        read_only: true
        bind:
          create_host_path: false
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,size=16m,uid=101,gid=101,mode=0700
      - /var/run:rw,nosuid,size=4m,uid=101,gid=101,mode=0700
      - /tmp:rw,nosuid,size=8m
    restart: unless-stopped

volumes:
  omniroute-data:
  agent_workspace_data:
  sandbox_socket:
  sandbox_workspaces:
  mcp_public_socket:
  mcp_files_socket:
  mcp_token_socket:
  mcp_registry_socket:
  mcp_saas_socket:
  mcp_browser_socket:
  mcp_browser_egress_socket:
  mcp_hub_remote_socket:
  mcp_hub_egress_socket:
  mcp_browser_artifact_staging:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=67108864,uid=65532,gid=65532,mode=0700,nosuid,nodev,noexec
  mcp_database_socket:
  mcp_database_local_socket:
  mcp_file_inputs:
  mcp_file_outputs:
  mcp_memory:
  browser_socket:
  browser_data:
  coding_socket:

networks:
  browser_egress:
    driver: bridge
  coding_internal:
    driver: bridge
    internal: true
  coding_provider:
    external: true
    name: ${CODING_PROVIDER_NETWORK_NAME:-modelmirror-coding-provider}
  mcp_public_egress:
    driver: bridge
  mcp_database_egress:
    driver: bridge
  mcp_saas_egress:
    driver: bridge
  mcp_browser_egress:
    driver: bridge
  mcp_hub_egress:
    driver: bridge
