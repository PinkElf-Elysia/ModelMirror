    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 768m
    cpus: 1.5
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,uid=65532,gid=65532,mode=0700
      - /workspaces:rw,nosuid,noexec,size=128m,uid=65532,gid=65532,mode=0700
    volumes:
      - mcp_saas_socket:/run/modelmirror-saas-mcp
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/modelmirror-saas-mcp/saas-mcp.sock'); s.sendall(b'{\"action\":\"health\"}\\n'); assert json.loads(s.recv(4096))['ok']",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  mcp-browser-egress:
    build:
      context: ./server/sandbox_sidecar
      dockerfile: Dockerfile.browser
    image: modelmirror-mcp-browser:wave7-v1
    container_name: modelmirror-mcp-browser-egress
    command: ["python", "-m", "sandbox_sidecar.browser_server", "egress"]
    networks:
      - mcp_browser_egress
    environment:
      MCP_BROWSER_EGRESS_SOCKET_PATH: /run/modelmirror-browser-egress/browser-egress.sock
      MCP_BROWSER_ALLOW_SYNTHETIC_DNS: "false"
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,uid=65532,gid=65532,mode=0700
    volumes:
      - mcp_browser_egress_socket:/run/modelmirror-browser-egress
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/modelmirror-browser-egress/browser-egress.sock'); s.sendall(b'{\"action\":\"health\"}\\n'); assert json.loads(s.recv(4096))['ok']",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  mcp-browser:
    build:
      context: ./server/sandbox_sidecar
      dockerfile: Dockerfile.browser
    image: modelmirror-mcp-browser:wave7-v1
    container_name: modelmirror-mcp-browser
    command: ["python", "-m", "sandbox_sidecar.browser_server"]
    network_mode: none
    depends_on:
      mcp-browser-egress:
        condition: service_healthy
    environment:
      MCP_BROWSER_SOCKET_PATH: /run/modelmirror-browser-mcp/browser-mcp.sock
      MCP_BROWSER_EGRESS_SOCKET_PATH: /run/modelmirror-browser-egress/browser-egress.sock
      MCP_BROWSER_PROFILE_ROOT: /profiles
      MCP_BROWSER_ARTIFACT_ROOT: /artifacts
      MCP_BROWSER_MAX_SESSIONS: "1"
      MCP_BROWSER_TRUSTED_CLIENT_UID: "0"
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./server/sandbox_sidecar/seccomp_profile.browser.json
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,uid=65532,gid=65532,mode=0700
      - /profiles:rw,nosuid,nodev,noexec,size=256m,uid=65532,gid=65532,mode=0700
      - /dev/shm:rw,nosuid,nodev,noexec,size=256m,uid=65532,gid=65532,mode=0700
    volumes:
      - mcp_browser_socket:/run/modelmirror-browser-mcp
      - mcp_browser_egress_socket:/run/modelmirror-browser-egress
      - mcp_browser_artifact_staging:/artifacts
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/modelmirror-browser-mcp/browser-mcp.sock'); s.sendall(b'{\"action\":\"health\"}\\n'); assert json.loads(s.recv(4096))['ok']",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s

  mcp-hub-egress:
    build:
      context: ./server/sandbox_sidecar
      dockerfile: Dockerfile.hub
    image: modelmirror-mcp-hub:wave1-v1
    container_name: modelmirror-mcp-hub-egress
    command: ["python", "-m", "sandbox_sidecar.hub_server", "egress"]
    networks:
      - mcp_hub_egress
    environment:
      MCP_HUB_EGRESS_SOCKET_PATH: /run/modelmirror-hub-egress/hub-egress.sock
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,uid=65532,gid=65532,mode=0700
    volumes:
      - mcp_hub_egress_socket:/run/modelmirror-hub-egress
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/modelmirror-hub-egress/hub-egress.sock'); s.sendall(b'{\"action\":\"health\"}\\n'); assert json.loads(s.recv(4096))['ok']",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  mcp-hub-remote:
    build:
      context: ./server/sandbox_sidecar
      dockerfile: Dockerfile.hub
    image: modelmirror-mcp-hub:wave1-v1
    container_name: modelmirror-mcp-hub-remote
    command: ["python", "-m", "sandbox_sidecar.hub_server", "remote"]
    network_mode: none
    depends_on:
      mcp-hub-egress:
        condition: service_healthy
    environment:
      MCP_HUB_REMOTE_SOCKET_PATH: /run/modelmirror-hub-mcp/hub-mcp.sock
      MCP_HUB_EGRESS_SOCKET_PATH: /run/modelmirror-hub-egress/hub-egress.sock
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,uid=65532,gid=65532,mode=0700
    volumes:
      - mcp_hub_remote_socket:/run/modelmirror-hub-mcp
      - mcp_hub_egress_socket:/run/modelmirror-hub-egress
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/modelmirror-hub-mcp/hub-mcp.sock'); s.sendall(b'{\"action\":\"health\"}\\n'); assert json.loads(s.recv(4096))['ok']",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  mcp-database:
    build:
      context: ./server/sandbox_sidecar
      dockerfile: Dockerfile.database
    image: modelmirror-mcp-database:wave5-v1
    container_name: modelmirror-mcp-database
    command: ["python", "-m", "sandbox_sidecar.database_server"]
    networks:
      - mcp_database_egress
    environment:
      MCP_DATABASE_MAX_SESSIONS: "6"
      MCP_DATABASE_SOCKET_PATH: /run/modelmirror-database-mcp/database-mcp.sock
      MCP_DATABASE_WORKSPACE_ROOT: /workspaces
      MCP_DATABASE_ALLOWED_ADAPTERS: dbhub,mongodb-mcp,clickhouse-mcp,redis-mcp,supabase-mcp,pab1it0-prometheus-mcp-server,qdrant-mcp-server-qdrant,cr7258-elasticsearch-mcp-server,zilliztech-mcp-server-milvus,neo4j-contrib-mcp-neo4j,arcadedata-arcadedb,greptimeteam-greptimedb-mcp-server,victoriametrics-community-mcp-victoriametrics
      MCP_DATABASE_PRIVATE_HOST_ALLOWLIST: ${MCP_DATABASE_PRIVATE_HOST_ALLOWLIST:-}
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.5
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,uid=65532,gid=65532,mode=0700
      - /workspaces:rw,nosuid,noexec,size=128m,uid=65532,gid=65532,mode=0700
    volumes:
      - mcp_database_socket:/run/modelmirror-database-mcp
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/modelmirror-database-mcp/database-mcp.sock'); s.sendall(b'{\"action\":\"health\"}\\n'); assert json.loads(s.recv(4096))['ok']",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  mcp-database-local:
    build:
      context: ./server/sandbox_sidecar
      dockerfile: Dockerfile.database
    image: modelmirror-mcp-database:wave5-v1
    container_name: modelmirror-mcp-database-local
    command: ["python", "-m", "sandbox_sidecar.database_server"]
    network_mode: none
    environment:
      MCP_DATABASE_MAX_SESSIONS: "4"
      MCP_DATABASE_SOCKET_PATH: /run/modelmirror-database-local-mcp/database-mcp.sock
      MCP_DATABASE_WORKSPACE_ROOT: /workspaces
      MCP_DATABASE_INPUT_ROOT: /inputs
      MCP_DATABASE_ALLOWED_ADAPTERS: duckdb-mcp
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 1g
    cpus: 1.5
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,uid=65532,gid=65532,mode=0700
      - /workspaces:rw,nosuid,noexec,size=64m,uid=65532,gid=65532,mode=0700
    volumes:
      - mcp_database_local_socket:/run/modelmirror-database-local-mcp
      - mcp_file_inputs:/inputs:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/modelmirror-database-local-mcp/database-mcp.sock'); s.sendall(b'{\"action\":\"health\"}\\n'); assert json.loads(s.recv(4096))['ok']",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  omniroute:
    image: diegosouzapw/omniroute:3.8.48@sha256:badb560971fdc23c2fb84b3e8695116239ff215b4cca4b07076201a8efae7f0d
    container_name: modelmirror-omniroute
    profiles:
      - omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      - omniroute-data:/app/data
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "20128"
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET:-}
      API_KEY_SECRET: ${OMNIROUTE_API_KEY_SECRET:-}
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:-}
      STORAGE_ENCRYPTION_KEY: ${OMNIROUTE_STORAGE_ENCRYPTION_KEY:-}
      OMNIROUTE_WS_BRIDGE_SECRET: ${OMNIROUTE_WS_BRIDGE_SECRET:-}
      REQUIRE_API_KEY: "true"
      ALLOW_API_KEY_REVEAL: "false"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const required=['JWT_SECRET','API_KEY_SECRET','INITIAL_PASSWORD','STORAGE_ENCRYPTION_KEY','OMNIROUTE_WS_BRIDGE_SECRET'];if(required.some(k=>!process.env[k]))process.exit(1);fetch('http://localhost:20128/api/monitoring/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  server:
    build:
      context: ./server
    container_name: modelmirror-server
    depends_on:
      browser:
        condition: service_healthy
      sandbox:
        condition: service_healthy
      mcp-public:
        condition: service_healthy
      mcp-files:
        condition: service_healthy
      mcp-token:
        condition: service_healthy
      mcp-registry:
        condition: service_healthy
      mcp-saas:
        condition: service_healthy
      mcp-browser:
        condition: service_healthy
      mcp-hub-egress:
        condition: service_healthy
      mcp-hub-remote:
        condition: service_healthy
      mcp-database:
        condition: service_healthy
      mcp-database-local:
        condition: service_healthy
    env_file:
      - path: ${MODELMIRROR_DATA_ROOT:-.}/server/.env
