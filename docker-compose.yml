services:
  browser:
    build:
      context: ./server/browser_sidecar
    container_name: modelmirror-browser
    networks:
      - browser_egress
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    shm_size: 256m
    tmpfs:
      - /tmp:rw,nosuid,size=256m
      - /home/pwuser:rw,nosuid,size=128m
    environment:
      BROWSER_SOCKET_PATH: /run/modelmirror-browser/browser.sock
      BROWSER_DATA_ROOT: /browser-data
      SANDBOX_WORKSPACE_ROOT: /sandbox-workspaces
      # Docker Desktop/VPN DNS may map public hostnames into the RFC 2544 Fake-IP range.
      # Literal access to that range remains blocked by the sidecar policy.
      BROWSER_ALLOW_SYNTHETIC_DNS: "true"
    volumes:
      - browser_socket:/run/modelmirror-browser
      - browser_data:/browser-data
      - sandbox_workspaces:/sandbox-workspaces:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const n=require('net');const s=n.createConnection('/run/modelmirror-browser/browser.sock');s.on('connect',()=>s.write('{\"action\":\"health\"}\\n'));s.on('data',d=>{const x=JSON.parse(d);process.exit(x.ok?0:1)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000)",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  sandbox:
    build:
      context: ./server/sandbox_sidecar
    container_name: modelmirror-sandbox
    environment:
      MCP_COMPUTE_MAX_SESSIONS: "6"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    volumes:
      - sandbox_socket:/run/modelmirror-sandbox
      - sandbox_workspaces:/workspaces
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/modelmirror-sandbox/sandbox.sock'); s.sendall(b'{\"action\":\"health\"}\\n'); assert json.loads(s.recv(4096))['ok']",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mcp-public:
    build:
      context: ./server/sandbox_sidecar
    image: modelmirror-mcp-public:wave17a-v1
    container_name: modelmirror-mcp-public
    command: ["python", "-m", "sandbox_sidecar.public_server"]
    networks:
      - mcp_public_egress
    environment:
      MCP_PUBLIC_MAX_SESSIONS: "6"
      # Public-read adapters are enabled only after isolated real-upstream acceptance.
      MCP_PUBLIC_ALLOWED_ADAPTERS: fetch-mcp,quickchart-mcp,geowire-mcp,nickclyde-duckduckgo-mcp-server,jpisnice-shadcn-ui-mcp-server,docker-hub-mcp,genomoncology-biomcp,safedep-vet,aas-ee-open-websearch,mnemox-ai-idea-reality-mcp,idosal-git-mcp,coinpaprika-dexpaprika-mcp,pab1it0-chess-mcp,rishijatia-fantasy-pl-mcp,yuna0x0-anilist-mcp,takashiishida-arxiv-latex-mcp
      MCP_PUBLIC_SOCKET_PATH: /run/modelmirror-public-mcp/public-mcp.sock
      MCP_PUBLIC_WORKSPACE_ROOT: /workspaces
      # Docker Desktop/VPN DNS may map public hosts into RFC 2544 Fake-IP space.
      # Literal IP URLs and every other non-global range remain denied.
      MCP_PUBLIC_ALLOW_SYNTHETIC_DNS: "true"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,uid=65532,gid=65532,mode=0700
      - /workspaces:rw,nosuid,noexec,size=128m,uid=65532,gid=65532,mode=0700
    volumes:
      - mcp_public_socket:/run/modelmirror-public-mcp
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/modelmirror-public-mcp/public-mcp.sock'); s.sendall(b'{\"action\":\"health\"}\\n'); assert json.loads(s.recv(4096))['ok']",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mcp-files:
    build:
      context: ./server/sandbox_sidecar
      dockerfile: Dockerfile.files
    image: modelmirror-mcp-files:wave3-v1
    container_name: modelmirror-mcp-files
    network_mode: none
    environment:
      MCP_FILES_MAX_SESSIONS: "4"
      MCP_FILE_ALLOWED_ADAPTERS: basic-memory-mcp,excel-mcp-server,git-mcp,markitdown-mcp,office-parser-mcp,output-renderer-mcp,zcaceres-markdownify-mcp,vivekvells-mcp-pandoc,antvis-mcp-server-chart,cyberchitta-llm-context-py,haris-musa-excel-mcp-server,dataeval-dingo,ozgurcd-gograph,githejie-mcp-server-calculator
      MCP_FILES_SOCKET_PATH: /run/modelmirror-files-mcp/files-mcp.sock
      MCP_FILE_INPUT_ROOT: /inputs
      MCP_FILE_OUTPUT_ROOT: /outputs
      MCP_FILE_MEMORY_ROOT: /memory
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.5
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=128m,uid=65532,gid=65532,mode=0700
    volumes:
      - mcp_files_socket:/run/modelmirror-files-mcp
      - mcp_file_inputs:/inputs:ro
      - mcp_file_outputs:/outputs
      - mcp_memory:/memory
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/modelmirror-files-mcp/files-mcp.sock'); s.sendall((json.dumps({'action':'health'})+'\\n').encode()); assert json.loads(s.recv(4096))['ok']",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  mcp-token:
    build:
      context: ./server/sandbox_sidecar
      dockerfile: Dockerfile.token
    image: modelmirror-mcp-token:wave4-v1
    container_name: modelmirror-mcp-token
    networks:
      - mcp_public_egress
    environment:
      MCP_TOKEN_MAX_SESSIONS: "6"
      MCP_TOKEN_ALLOWED_ADAPTERS: agentql-mcp,blazickjp-arxiv-mcp-server,brave-brave-search-mcp-server,brave-search-mcp,exa-mcp,fatwang2-search1api-mcp,firecrawl-mcp,perplexity-mcp,tavily-mcp,axiom-mcp,figma-context-mcp,google-maps-mcp,grafana-mcp,graphlit-mcp,kagi-mcp,kagisearch-kagimcp,livetennisapi-livetennisapi-mcp,pinecone-assistant-mcp,shodan-mcp,virustotal-mcp
      MCP_TOKEN_SOCKET_PATH: /run/modelmirror-token-mcp/token-mcp.sock
      MCP_TOKEN_WORKSPACE_ROOT: /workspaces
      MCP_PUBLIC_ALLOW_SYNTHETIC_DNS: "true"
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.5
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,uid=65532,gid=65532,mode=0700
      - /workspaces:rw,nosuid,noexec,size=128m,uid=65532,gid=65532,mode=0700
    volumes:
      - mcp_token_socket:/run/modelmirror-token-mcp
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/modelmirror-token-mcp/token-mcp.sock'); s.sendall(b'{\"action\":\"health\"}\\n'); assert json.loads(s.recv(4096))['ok']",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  mcp-registry:
    build:
      context: ./server/sandbox_sidecar
      dockerfile: Dockerfile.registry
    image: modelmirror-mcp-registry:wave9-v1
    container_name: modelmirror-mcp-registry
    networks:
      - mcp_public_egress
    environment:
      MCP_TOKEN_MAX_SESSIONS: "4"
      MCP_TOKEN_ALLOWED_ADAPTERS: terraform-mcp
      MCP_TOKEN_SOCKET_PATH: /run/modelmirror-registry-mcp/registry-mcp.sock
      MCP_TOKEN_WORKSPACE_ROOT: /workspaces
      # Docker Desktop maps public DNS through 198.18/15; the adapter still
      # pins registry.terraform.io and verifies its TLS hostname/certificate.
      MCP_PUBLIC_ALLOW_SYNTHETIC_DNS: "true"
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,uid=65532,gid=65532,mode=0700
      - /workspaces:rw,nosuid,nodev,noexec,size=64m,uid=65532,gid=65532,mode=0700
    volumes:
      - mcp_registry_socket:/run/modelmirror-registry-mcp
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/modelmirror-registry-mcp/registry-mcp.sock'); s.sendall(b'{\"action\":\"health\"}\\n'); assert json.loads(s.recv(4096))['ok']",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

